<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linux 内核执行流程动画 · CPU / 内存 / 设备逐跳演示</title>
<style>:root{
  --bg:#0e1312;--paper:#151b1a;--paper2:#1b2321;--ink:#e3e8e6;--ink2:#b3bcb9;--muted:#7f8a87;--line:#26302d;--line2:#1f2826;
  --acc:#4cc597;--acc2:#1d3a30;--code:#222a28;--halo:#0e1312;
  --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,"Noto Sans Mono CJK SC",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
}
[data-theme=light]{
  --bg:#f4f6f4;--paper:#fff;--paper2:#f7f9f8;--ink:#1d2321;--ink2:#4a5350;--muted:#7b8582;--line:#dde2df;--line2:#eceeec;
  --acc:#1f7a5c;--acc2:#e2f0ea;--code:#eef1ef;--halo:#f4f6f4;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 var(--sans);-webkit-font-smoothing:antialiased;
  display:grid;grid-template-rows:52px 40px minmax(240px,1fr) minmax(280px,40vh);overflow:hidden}
code{font:12.5px var(--mono);background:var(--code);padding:1px 5px;border-radius:4px;color:var(--ink)}
button,select{font:inherit;color:inherit;cursor:pointer}
a{color:var(--acc)}

/* header */
.top{display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--paper)}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font-size:16px}
.brand span{color:var(--acc);font:600 12px var(--mono);letter-spacing:.08em}
.stories{display:flex;gap:4px;flex:1;min-width:0}
.stories button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:3px 12px;font-size:13px;color:var(--ink2);white-space:nowrap}
.stories button small{color:var(--muted);margin-left:6px;font-size:11.5px}
.stories button.on{background:var(--acc2);border-color:var(--acc);color:var(--acc);font-weight:600}
.ctrl{display:flex;align-items:center;gap:6px;white-space:nowrap}
.ctrl button,.ctrl select{border:1px solid var(--line);background:var(--paper2);border-radius:7px;height:30px;min-width:32px;padding:0 8px;font-size:13px}
.ctrl button.play{min-width:46px;background:var(--acc);border-color:var(--acc);color:#06140f;font-weight:700}
.ctrl .grp{display:inline-flex}
.ctrl .grp button:first-child{border-radius:7px 0 0 7px}
.ctrl .grp button:last-child{border-radius:0 7px 7px 0;border-left:none}
.ctrl .grp button[id$=next]:first-child,.ctrl .grp button[id$=prev]:last-child{font-size:12px;color:var(--ink2)}
.pos{font:12px var(--mono);color:var(--ink2);min-width:72px;text-align:center}
.chk{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--ink2);margin:0 4px}
.clock{font:12px var(--mono);color:var(--muted);min-width:94px;text-align:right}
.back{font-size:12.5px;text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:4px 9px}

/* timeline */
.tlrow{display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--paper)}
.ctxpill{width:232px;flex:none;display:flex;align-items:center;gap:8px;font-size:12.5px;white-space:nowrap;overflow:hidden}
.ctxpill i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent);flex:none}
.ctxpill b{color:var(--c)}
.ctxpill span{color:var(--muted)}
.tl{position:relative;flex:1;height:18px;cursor:pointer;border-radius:5px;overflow:hidden;background:var(--line2)}
.tl-segs{position:absolute;inset:0;display:flex}
.tl-segs div{height:100%;border-right:1px solid var(--paper);background:color-mix(in srgb,var(--c) 30%,transparent);font:10.5px/18px var(--mono);color:var(--ink2);text-align:center;overflow:hidden}
.tl-segs div.on{background:color-mix(in srgb,var(--c) 62%,transparent);color:#fff;font-weight:700}
.tl-prog{position:absolute;left:0;top:auto;bottom:0;height:3px;background:var(--acc)}
.tl-head{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);box-shadow:0 0 6px var(--ink)}
.hint{font-size:11.5px;color:var(--muted);white-space:nowrap}

/* stage */
.stage{position:relative;overflow:hidden;display:grid;grid-template-rows:56px 1fr;background:radial-gradient(1200px 500px at 50% -10%,color-mix(in srgb,var(--acc) 7%,transparent),transparent),var(--bg)}
.lanes{position:relative;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--paper) 85%,transparent);z-index:3}
.lanes .lane{position:absolute;top:6px;bottom:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:7px;
  border:1px solid color-mix(in srgb,var(--zc) 45%,transparent);border-top:3px solid var(--zc);background:color-mix(in srgb,var(--zc) 9%,var(--paper));
  font-size:12px;line-height:1.25;text-align:center;padding:0 2px;cursor:pointer;transition:none;margin:0 2px}
.lanes .lane b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lanes.narrow .lane{font-size:11px;line-height:1.15}
.lanes.narrow .lane b{white-space:normal;word-break:break-all;overflow:hidden;max-height:2.4em}
.lanes .lane small{font-size:10px;color:var(--muted);white-space:nowrap}
.lanes .lane.step{background:color-mix(in srgb,var(--zc) 22%,var(--paper))}
.lanes .lane.on{background:var(--zc);color:#08110e;box-shadow:0 0 18px color-mix(in srgb,var(--zc) 70%,transparent)}
.lanes .lane.on small{color:#08110e}
.lanes .gut{position:absolute;left:14px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;font-size:12px;color:var(--muted)}
.lanes .gut b{color:var(--ink2);font-size:13px}
.view{position:relative;overflow:hidden}
.body{position:absolute;left:0;top:0;right:0;will-change:transform}
.body svg{position:absolute;left:0;top:0;overflow:visible}
.band{fill:transparent}
.band.on{fill:color-mix(in srgb,var(--c) 9%,transparent)}
.bandline{stroke:var(--line);stroke-width:1}
.ctxbar{opacity:.75}
.life{stroke-width:1.2;stroke-dasharray:3 5;opacity:.38}
.call{opacity:.06}
.call.past{opacity:.32}
.call.done{opacity:1}
.call.cur{opacity:1}
.call.cur .arrow,.call.cur .head,.call.cur .dot,.call.cur .bar{opacity:0}
.call .arrow{fill:none;stroke-width:1.8}
.call.handoff .arrow{stroke-dasharray:6 5}
.call .bar{opacity:.28}
.call text{font:12.5px var(--mono);fill:var(--ink);paint-order:stroke;stroke:var(--halo);stroke-width:4px;stroke-linejoin:round}
.call.past text{fill:var(--ink2)}
#prog{fill:none;stroke-width:2.6}
#packet .p0{opacity:.28}
.gl{position:absolute;left:12px;display:flex;gap:9px;align-items:flex-start;cursor:pointer;opacity:.45}
.gl.on{opacity:1}
.gl.done{opacity:.8}
.gl .num{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--mono);background:color-mix(in srgb,var(--c) 30%,transparent);color:var(--c);border:1px solid var(--c)}
.gl.on .num{background:var(--c);color:#08110e;box-shadow:0 0 14px var(--c)}
.gl .tt{font-size:13px;line-height:1.4;font-weight:600}
.gl .cx{font-size:11.5px;color:var(--c);font-weight:400;display:block;margin-top:2px}
.sts{position:absolute;display:flex;gap:8px;flex-wrap:wrap;opacity:0}
.sts.show{opacity:1}
.st{font-size:12px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:1px 10px;white-space:nowrap}
.st b{font-family:var(--mono)}
.st .S,.st .D,.st .Z,.st .R,.st .N,.st .X{font:700 12px var(--mono);padding:0 4px;border-radius:4px}
.st .R{color:#4cc597}.st .S{color:#7cb3ff}.st .D{color:#ff8a65}.st .Z{color:#c9a0ff}.st .N{color:#e3c26b}.st .X{color:var(--muted)}
.caption{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);max-width:min(1100px,92%);z-index:4;pointer-events:none;
  background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;
  padding:8px 18px;font-size:15px;box-shadow:0 8px 30px rgba(0,0,0,.35);display:flex;gap:10px;align-items:baseline;white-space:nowrap;overflow:hidden}
.caption .k{font:700 13px var(--mono);color:var(--c)}
.caption b{font-family:var(--mono);font-size:15.5px}
.caption .z{color:var(--c);font-size:13px}
.caption .nt{color:var(--ink2);overflow:hidden;text-overflow:ellipsis}

/* overlays */
.overlay{position:absolute;inset:0;z-index:6;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(5px);opacity:0;pointer-events:none}
.overlay.live{pointer-events:auto}
.ov{max-width:980px;padding:0 40px}
.ov .eb{font:600 12.5px var(--mono);letter-spacing:.14em;color:var(--acc)}
.ov h1{font-size:32px;margin:6px 0 12px;line-height:1.3}
.ov p{font-size:16px;color:var(--ink2);line-height:1.85;margin:0 0 16px}
.ov .meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.ov .meta span{border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:12.5px;color:var(--ink2)}
.ov .btns{display:flex;gap:10px}
.ov .btns button{border:1px solid var(--acc);background:var(--acc);color:#06140f;border-radius:9px;padding:7px 18px;font-weight:700}
.ov .btns button.alt{background:transparent;color:var(--acc)}
.ov ol{columns:2;column-gap:36px;margin:0 0 18px;padding-left:22px;font-size:13.5px;color:var(--ink2)}
.ov ol li{cursor:pointer;break-inside:avoid}
.ov ol li:hover{color:var(--acc)}

/* bottom panel */
.panel{display:grid;grid-template-columns:1.3fr 1fr 1.05fr;gap:12px;padding:12px 14px 14px;border-top:1px solid var(--line);background:var(--paper);min-height:0}
.card{background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;overflow:auto;min-height:0;position:relative}
.card h4{margin:0 0 6px;font-size:13px;color:var(--ink2)}
.card h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.kick{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin-bottom:4px}
.tag{font-size:11.5px;border-radius:6px;padding:0 7px;border:1px solid color-mix(in srgb,var(--c,var(--muted)) 60%,transparent);color:var(--c,var(--ink2));background:color-mix(in srgb,var(--c,var(--muted)) 12%,transparent)}
.card h2{font-size:19px;margin:2px 0 4px;line-height:1.35}
.card .cxd{font-size:12.5px;color:var(--c);margin:0 0 8px}
.card .tx{margin:0 0 10px;font-size:14.5px;line-height:1.8}
.card .why{border-left:3px solid var(--acc);background:color-mix(in srgb,var(--acc) 8%,transparent);padding:6px 10px;border-radius:0 8px 8px 0;font-size:13.5px;margin-bottom:10px}
.card .why b{color:var(--acc);margin-right:6px}
.card .stl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.card .lnk{font-size:12.5px}
.prin{font-size:13.5px;line-height:1.7;padding:8px 10px;border-radius:8px;background:var(--code);margin-bottom:10px}
.prin b{color:var(--acc);margin-right:6px}
.fnbox{border:1px solid var(--c);border-radius:10px;padding:8px 12px;background:color-mix(in srgb,var(--c) 10%,transparent);margin-bottom:10px}
.fnbox .fn{font:700 18px var(--mono);word-break:break-all}
.fnbox .nt{font-size:13.5px;color:var(--ink2)}
.fnbox .src{font:11.5px var(--mono);color:var(--muted);word-break:break-all}
.fnbox.pending{opacity:.55;border-style:dashed}
.comp h3{font-size:15px;margin:0 0 2px;display:flex;align-items:center;gap:8px}
.comp h3 i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.comp h3 small{font-weight:400;font-size:11.5px;color:var(--c)}
.comp .cd{font:12px var(--mono);color:var(--muted);margin-bottom:4px}
.comp p{margin:0 0 6px;font-size:13.5px;line-height:1.75;color:var(--ink2)}
.comp ul{margin:0;padding-left:18px;font-size:12.5px;color:var(--ink2)}
.comp ul code{font-size:11.5px}
.map{display:flex;flex-direction:column}
#map{flex:1;min-height:0}
#map svg{width:100%;height:100%;display:block}
.mn rect{fill:color-mix(in srgb,var(--zc) 7%,var(--paper));stroke:color-mix(in srgb,var(--zc) 40%,transparent);stroke-width:1}
.mn text{font-size:14.5px;fill:var(--muted);text-anchor:middle;dominant-baseline:central}
.mn.step rect{fill:color-mix(in srgb,var(--zc) 22%,var(--paper));stroke:var(--zc);stroke-width:1.5}
.mn.step text{fill:var(--ink)}
.mn.on rect{fill:var(--zc);stroke:var(--zc)}
.mn.on text{fill:#08110e;font-weight:700}
.mh{fill:none;stroke:var(--ink2);stroke-width:1.6;opacity:0}
.mh.done{opacity:.75}
.mh.hand{stroke-dasharray:4 4}
#mprog{fill:none;stroke:var(--acc);stroke-width:2.4}

/* machine view */
body.mach{grid-template-rows:52px 40px minmax(300px,1fr) minmax(250px,31vh)}
body.mach .caption{display:none}
body.mach .seqonly,body:not(.mach) .machonly,body:not(.mach) .machv{display:none}
.machv{position:absolute;inset:0;z-index:5;background:var(--bg);padding:6px 10px 4px}
.machv svg{width:100%;height:100%;display:block;--chg:#f2c14e;--mem:#6ea8ff;--dev:#f0a35e}
[data-theme=light] .machv svg{--chg:#c98a00;--mem:#2f6fd6;--dev:#c2671c}
.msvg text{font-family:var(--sans);fill:var(--ink)}
.msvg .unit{fill:color-mix(in srgb,var(--acc) 5%,var(--paper));stroke:color-mix(in srgb,var(--acc) 45%,transparent);stroke-width:1.4}
.msvg .unit.dev{fill:color-mix(in srgb,var(--dev) 5%,var(--paper));stroke:color-mix(in srgb,var(--dev) 45%,transparent)}
.msvg .utitle{font:700 15px var(--mono);fill:var(--acc)}
.msvg .usub{font:12px var(--mono);fill:var(--ink2)}
.msvg .dtitle{font-size:12.5px;font-weight:600;fill:var(--dev)}
.msvg .ctitle{font-size:13.5px;font-weight:600;fill:var(--mem)}
.msvg .csub{font-size:11px;fill:var(--muted)}
.msvg .bdg rect{fill:var(--paper2);stroke:var(--line)}
.msvg .bdg text{font:11px var(--mono);fill:var(--ink2)}
.msvg .bdg .bk{fill:var(--muted);font-family:var(--sans)}
.msvg .bdg.on rect{fill:color-mix(in srgb,var(--acc) 22%,var(--paper));stroke:var(--acc)}
.msvg .bdg.on text{fill:var(--ink)}
.msvg .bdg.chg rect{stroke:var(--chg);stroke-width:2;filter:drop-shadow(0 0 5px var(--chg))}
.msvg .reg rect{fill:var(--paper2);stroke:var(--line)}
.msvg .rn{font:700 12px var(--mono);fill:var(--acc)}
.msvg .rv{font:12px var(--mono);fill:var(--ink)}
.msvg .rh{font-size:10.5px;fill:var(--muted)}
.msvg .ctl .rn{font-size:11px}
.msvg .reg.chg rect{stroke:var(--chg);stroke-width:2;fill:color-mix(in srgb,var(--chg) 14%,var(--paper2));filter:drop-shadow(0 0 6px color-mix(in srgb,var(--chg) 70%,transparent))}
.msvg .reg.chg .rv{fill:var(--chg);font-weight:700}
.msvg .bl{font:700 11.5px var(--mono);fill:var(--ink2)}
.msvg .bit rect{fill:var(--paper2);stroke:var(--line)}
.msvg .bn{font:600 9.5px var(--mono);fill:var(--muted);text-anchor:middle}
.msvg .bb{font:8.5px var(--mono);fill:var(--muted);text-anchor:middle;opacity:.7}
.msvg .bit.on rect{fill:color-mix(in srgb,var(--acc) 55%,var(--paper));stroke:var(--acc)}
.msvg .bit.on .bn{fill:var(--ink)}
.msvg .bit.chg rect{stroke:var(--chg);stroke-width:2.2;filter:drop-shadow(0 0 6px var(--chg))}
.msvg .bit.chg .bn{fill:var(--chg)}
.msvg .vreg rect{fill:color-mix(in srgb,var(--mem) 6%,var(--paper));stroke:color-mix(in srgb,var(--mem) 35%,transparent)}
.msvg .pn{font-size:12px;font-weight:600}
.msvg .pa{font:10.5px var(--mono);fill:var(--muted)}
.msvg .vreg.hot rect{fill:color-mix(in srgb,var(--mem) 22%,var(--paper));stroke:var(--mem);stroke-width:1.8}
.msvg .prow{font:8.8px var(--mono);fill:var(--muted);text-anchor:end}
.msvg .pcell{opacity:.82;stroke:none}
.msvg .pcell.free{opacity:.62}
.msvg .pcell.dim{opacity:.4}
.msvg .pcell.free.dim{opacity:.4}
[data-theme=light] .msvg .pcell.free{fill:#c9d1ce}
.msvg .pcell.hot{opacity:1;stroke:var(--ink);stroke-width:.8;filter:brightness(1.25)}
.msvg .pcell.free.hot{opacity:.62;stroke:none;filter:none}
.msvg .pcell.chg{stroke:var(--chg);stroke-width:1.4;filter:drop-shadow(0 0 4px var(--chg))}
.msvg .phole{fill:none;stroke:var(--line);stroke-dasharray:3 3}
.msvg .pholet{font-size:9px;fill:var(--muted);text-anchor:middle}
.msvg .plab{font-size:9.5px;font-weight:700;fill:var(--ink);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.msvg .pzt{font-size:10.5px;fill:var(--ink2)}
.msvg .ptick{font:8.8px var(--mono);fill:var(--muted)}
.msvg .pzlink{fill:none;stroke:var(--muted);stroke-width:.8;stroke-dasharray:2 2}
.msvg .b8k{fill:none;stroke:var(--chg);stroke-width:1}
.msvg .pleg text{font-size:10px;fill:var(--muted)}
.msvg .pleg.hot text{fill:var(--ink);font-weight:700}
.msvg .pcl{font-size:11px;fill:var(--ink2)}
.msvg .pcl.chg{fill:var(--ink)}
.msvg .pcl.muted{fill:var(--muted)}
.msvg .pcn{font-weight:700}
.msvg .pcn.w{fill:#ff6b6b}
.msvg .pcn.r{fill:#5ec8ff}
.msvg .core.w,.msvg .dot.w .core{fill:#ff5252;stroke:#fff;stroke-width:1}
.msvg .core.r,.msvg .dot.r .core{fill:var(--bg);stroke:#5ec8ff;stroke-width:1.8}
.msvg .dot .ring{fill:none;stroke-width:1.6}
.msvg .dot.w .ring{stroke:#ff5252}
.msvg .dot.r .ring{stroke:#5ec8ff}
.msvg .dot.old{opacity:.38}
.msvg .dot.old .core{stroke-width:.8}
.msvg .pleg.rw text{fill:var(--ink2)}
[data-theme=light] .msvg .core.w,[data-theme=light] .msvg .dot.w .core{stroke:#7a0000}
.msvg .hole{font-size:11px;fill:var(--muted);text-anchor:middle}
.msvg .vmap{fill:none;stroke:var(--mem);stroke-width:1.2;opacity:.16}
.msvg .vmap.hot{opacity:.95;stroke-width:2.2;stroke-dasharray:6 4}
.msvg .dk{font-size:11px;fill:var(--muted)}
.msvg .dvv{font:11.5px var(--mono);fill:var(--ink)}
.msvg .dv.chg .dvv{fill:var(--chg);font-weight:700}
.msvg .screen{fill:#000;stroke:#333}
.msvg .screen.chg{stroke:var(--chg);stroke-width:2}
.msvg .scr{font:11px var(--mono);fill:#bfbfbf;white-space:pre}
.msvg .cursor{fill:#bfbfbf}
.msvg .bus{fill:none;stroke:var(--line);stroke-width:7;stroke-linejoin:round;stroke-linecap:round}
.msvg .buslab{font-size:11px;fill:var(--muted);text-anchor:middle}
.msvg .xp{fill:none;stroke:var(--acc);stroke-width:2;opacity:.18;stroke-dasharray:5 5}
.msvg .xp.cur{opacity:.95;stroke-dasharray:none;stroke-width:3}
.msvg .xp.done{opacity:.5;stroke-dasharray:none}
.msvg .pk0{fill:var(--chg);opacity:.35}
.msvg .pk1{fill:var(--chg)}
#m-pklab rect{fill:var(--chg)}
#m-pklab text{font:600 12px var(--sans);fill:#1a1300}
.xl{margin:0 0 10px;padding:0;list-style:none;font-size:12.5px;counter-reset:x}
.xl li{padding:3px 8px 3px 26px;border-radius:6px;position:relative;color:var(--muted)}
.xl li::before{counter-increment:x;content:counter(x);position:absolute;left:7px;font:700 11px var(--mono)}
.xl li b{font-family:var(--mono);font-weight:600;margin-right:8px}
.xl li.done{color:var(--ink2)}
.xl li.cur{color:var(--ink);background:color-mix(in srgb,#f2c14e 18%,transparent)}
.say{border-left:3px solid #f2c14e;background:color-mix(in srgb,#f2c14e 8%,transparent);padding:6px 10px;border-radius:0 8px 8px 0;font-size:14px;line-height:1.75;margin-bottom:10px}
.say b{color:#d9a72e;margin-right:6px}
#mstate h4{margin:0 0 6px}
#mstate h4.chg{color:#e0b13e}
#mstate .muted,.muted{color:var(--muted);font-size:12.5px;margin:0 0 8px}
.stk{margin:0 0 10px;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:3px 6px;font:11.5px var(--mono)}
.stk li{border:1px solid var(--line);background:var(--paper);border-radius:5px;padding:2px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stk li:first-child{border-color:var(--acc)}
.wva{font-size:12.5px;margin-bottom:5px}
.walk{width:100%;border-collapse:collapse;font-size:12px}
.walk td{padding:2px 6px;border-top:1px solid var(--line)}
.walk td:first-child{font:700 11.5px var(--mono);width:50px}
.walk tr.ok td:last-child{color:var(--acc)}
.walk tr.bad td:last-child{color:#ff8a65;font-weight:600}
.msvg .tipk{cursor:help}
.mtip{position:absolute;display:none;z-index:9;max-width:380px;pointer-events:none;background:var(--paper);border:1px solid var(--acc);border-radius:10px;
  padding:9px 12px;box-shadow:0 10px 30px rgba(0,0,0,.45);font-size:13px;line-height:1.65;color:var(--ink)}
.mtip .th{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mtip .th b{font:700 16px var(--mono);color:var(--acc)}
.mtip .th span{font:600 13px var(--mono);color:var(--ink)}
.mtip .tz{font-size:13px;font-weight:600;color:var(--ink2)}
.mtip .tz i{font-style:normal;font-weight:400;color:var(--muted);margin-left:8px;font-size:12px}
.mtip .tv{font:12px var(--mono);color:#e0b13e;margin-top:2px}
.mtip p{margin:5px 0 0;color:var(--ink2)}
.ov .cav{font-size:13px;color:var(--muted)}

@media (max-width:1700px){.brand span,.hint{display:none}}
@media (max-width:1500px){.stories button small{display:none}.top{gap:10px;padding:0 12px}}

body.record .ctrl,body.record .hint{display:none}
body.record{cursor:none}
body.record .stories button:not(.on){display:none}

.deep{display:none;position:fixed;inset:0;top:0;overflow:auto;z-index:20;background:var(--bg);padding:0}
body.deep-on .deep{display:block}
body.deep-on .top,body.deep-on .tlrow,body.deep-on .stage,body.deep-on .panel{visibility:hidden}
body.deep-on{overflow:hidden}
.deep-wrap{max-width:1180px;margin:0 auto;padding:18px 22px 60px;height:100%;overflow:auto}
.deep-wrap h2{font-size:20px;margin:6px 0 12px}
.deep .lead{color:var(--ink2);font-size:13.5px;margin:0 0 14px}
.deep .tabs,.deep .swtabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.deep .tab,.deep .swtabs button,.deep .swnav button,.deep .calc button,.deep .smp{border:1px solid var(--line);background:var(--paper2);color:var(--ink2);border-radius:8px;padding:5px 12px;font-size:13px;cursor:pointer}
.deep .tab.on,.deep .swtabs button.on{border-color:var(--acc);color:var(--ink);background:color-mix(in srgb,var(--acc) 14%,transparent)}
.deep .pane{display:none}
.deep .pane.on{display:block}
.deep .sec{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.deep .sec h3{margin:0 0 8px;font-size:15.5px;display:flex;gap:10px;align-items:center}
.deep .no{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--acc);color:#06140f;font-size:12px;font-weight:700}
.deep .why{border-left:3px solid var(--acc);background:color-mix(in srgb,var(--acc) 8%,transparent);padding:6px 10px;border-radius:0 8px 8px 0;font-size:13.5px;margin-bottom:10px}
.deep .why b{color:var(--acc);margin-right:6px}
.deep .codebox{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:8px 0;background:var(--code)}
.deep .cfile{font:600 12px var(--mono);padding:6px 10px;background:var(--paper2);color:var(--acc);border-bottom:1px solid var(--line)}
.deep .cl{display:grid;grid-template-columns:54px minmax(0,1.1fr) minmax(0,1fr);align-items:start;border-bottom:1px solid var(--line2)}
.deep .cl:last-child{border-bottom:0}
.deep .cl.hit{background:color-mix(in srgb,#f2c14e 12%,transparent)}
.deep .ln{font:12px var(--mono);color:var(--muted);text-align:right;padding:4px 10px 4px 0;user-select:none}
.deep pre.cx{margin:0;font:12.5px/1.6 var(--mono);white-space:pre-wrap;word-break:break-all;padding:4px 8px;color:var(--ink)}
.deep .nt{font-size:12.8px;color:var(--ink2);padding:4px 10px 4px 4px;line-height:1.6}
.deep .src{font:12px var(--mono);color:var(--muted);margin:6px 0}
.deep .mm2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.deep .mmcol h4,.deep .calc h4{margin:4px 0 10px;font-size:14px}
.deep .reg,.deep .pr{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--paper)}
.deep .reg i{width:6px;border-radius:3px;background:var(--c)}
.deep .reg div,.deep .pr{display:flex;flex-direction:column;gap:2px;font-size:13px}
.deep .reg code{width:fit-content;font-size:12px}
.deep .reg span,.deep .pr span{color:var(--ink2);font-size:12.8px}
.deep .pr b{font-size:13px}
.deep .rules{margin:0;padding-left:18px;font-size:13px;color:var(--ink2)}
.deep .rules li{margin-bottom:6px}
.deep .calc{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.deep .row{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.deep .row label{font-size:13px;color:var(--ink2);min-width:200px}
.deep .row input{font:13px var(--mono);padding:5px 8px;border:1px solid var(--line);background:var(--paper2);color:var(--ink);border-radius:7px;width:260px}
.deep .out{font-size:13px;margin:6px 0 14px;color:var(--ink2);line-height:1.9}
.deep .chips{display:flex;gap:8px;margin-bottom:6px}
.deep table.walk{border-collapse:collapse;font-size:13px;width:100%;margin:6px 0}
.deep table.walk th,.deep table.walk td{border:1px solid var(--line);padding:5px 8px;text-align:left;font-family:var(--mono)}
.deep table.walk th{font-family:var(--sans);background:var(--paper2)}
.deep .tip{font-size:12.8px;color:var(--ink2)}
.deep .err{color:#e07a5a;font-size:13px}
.deep .dots{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.deep .dot{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--paper2);color:var(--ink2);cursor:pointer}
.deep .dot.on{background:var(--acc);color:#06140f;border-color:var(--acc)}
.deep .cells{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.deep .cell{border:1px solid var(--line);border-top:3px solid var(--c);border-radius:8px;padding:8px 10px;background:var(--paper);display:flex;flex-direction:column;gap:2px}
.deep .cell small{color:var(--muted);font-size:12px}
.deep .cell b{font:12.5px var(--mono);word-break:break-all;font-weight:600}
.deep .swwhat{font-size:14px;margin-bottom:8px;line-height:1.8}
.deep .swwhat b{display:block;color:var(--acc);margin-bottom:2px}
.deep .swnav{display:flex;gap:8px;margin-top:10px}
@media (max-width:900px){.deep .mm2{grid-template-columns:1fr}.deep .cells{grid-template-columns:1fr 1fr}.deep .cl{grid-template-columns:44px 1fr}.deep .nt{grid-column:2}}
</style>

window.KDEEP={"boot":[{"title":"一、压缩镜像入口：栈、GS 与远返回进入内核代码段","why":"刚进入 startup_64 时 CPU 还在引导器留下的段与栈上，必须先把栈、GS（每 CPU 数据与栈保护 canary 的基址）和代码段选择子都换成内核自己的，之后才能跑 C 代码。","ranges":[{"file":"arch/x86/kernel/head_64.S","from":60,"to":77,"lines":[{"n":60,"text":"","note":""},{"n":61,"text":"        /* Set up the stack for verify_cpu() */","note":""},{"n":62,"text":"        leaq        __top_init_kernel_stack(%rip), %rsp","note":"把栈指向 __top_init_kernel_stack，verify_cpu 与后续 C 调用都需要有效的栈。"},{"n":63,"text":"","note":""},{"n":64,"text":"        /* Setup GSBASE to allow stack canary access for C code */","note":""},{"n":65,"text":"        movl        $MSR_GS_BASE, %ecx","note":"MSR_GS_BASE 的编号放入 %ecx，下一步的 wrmsr 写的就是它。"},{"n":66,"text":"        leaq        INIT_PER_CPU_VAR(fixed_percpu_data)(%rip), %rdx","note":""},{"n":67,"text":"        movl        %edx, %eax","note":""},{"n":68,"text":"        shrq        $32,  %rdx","note":""},{"n":69,"text":"        wrmsr","note":"wrmsr 把 %edx:%eax 写入 GS 基址：之后 %gs:xx 访问的是 fixed_percpu_data。"},{"n":70,"text":"","note":""},{"n":71,"text":"        call        startup_64_setup_gdt_idt","note":"建立内核 GDT 与 IDT，此时才有合法的段描述符可用。"},{"n":72,"text":"","note":""},{"n":73,"text":"        /* Now switch to __KERNEL_CS so IRET works reliably */","note":""},{"n":74,"text":"        pushq        $__KERNEL_CS","note":"把 __KERNEL_CS（内核代码段选择子）压栈，作为远返回的新 CS。"},{"n":75,"text":"        leaq        .Lon_kernel_cs(%rip), %rax","note":"把 .Lon_kernel_cs 的地址压栈，作为远返回的新 RIP。"},{"n":76,"text":"        pushq        %rax","note":""},{"n":77,"text":"        lretq","note":"lretq 从栈上弹出 RIP 与 CS，真正切到内核代码段。这是长模式里的“远跳转”。"}]}]},{"title":"二、切到内核页表 early_top_pgt","why":"引导阶段的页表只是临时的恒等映射。切换到 early_top_pgt 后，地址翻译来自内核自己维护的页表，但恒等映射仍保留，所以当前执行的指令在换表期间保持有效。","ranges":[{"file":"arch/x86/kernel/head_64.S","from":122,"to":126,"lines":[{"n":122,"text":"        /*","note":""},{"n":123,"text":"         * Switch to early_top_pgt which still has the identity mappings","note":""},{"n":124,"text":"         * present.","note":""},{"n":125,"text":"         */","note":""},{"n":126,"text":"        movq        %rax, %cr3","note":"把 early_top_pgt 的物理地址写入 CR3。CR3 变化后，之后所有访存都经过这套页表翻译。"}]}]},{"title":"三、间接调用 x86_64_start_kernel，进入 C 世界","why":"initial_code 是一个存放函数指针的数据项，汇编通过它间接调用 C 入口；C 函数里才能使用 boot_params 等结构。","ranges":[{"file":"arch/x86/kernel/head_64.S","from":411,"to":413,"lines":[{"n":411,"text":"        xorl        %ebp, %ebp        # clear frame pointer","note":""},{"n":412,"text":"        ANNOTATE_RETPOLINE_SAFE","note":""},{"n":413,"text":"        callq        *initial_code(%rip)","note":"间接调用 initial_code 指向的函数，正常情况下它就是 x86_64_start_kernel。"}]},{"file":"arch/x86/kernel/head_64.S","from":474,"to":474,"lines":[{"n":474,"text":"SYM_DATA(initial_code,        .quad x86_64_start_kernel)","note":"initial_code 的初值：指向 x86_64_start_kernel，这是汇编与 C 的交接点。"}]},{"file":"arch/x86/kernel/head64.c","from":484,"to":488,"lines":[{"n":484,"text":"","note":""},{"n":485,"text":"        /* set init_top_pgt kernel high mapping*/","note":""},{"n":486,"text":"        init_top_pgt[511] = early_top_pgt[511];","note":"把早期高半部映射拷进 init_top_pgt[511]：内核代码与数据的高半部映射由此进入最终页表。"},{"n":487,"text":"","note":""},{"n":488,"text":"        x86_64_start_reservations(real_mode_data);","note":"调用 x86_64_start_reservations，继续做 C 层面的早期初始化。"}]}]},{"title":"start_kernel 与 rest_init：通用初始化与 1 号、2 号进程","why":"start_kernel 是与架构无关的总入口，先关中断再逐步初始化；rest_init 之后把 1 号、2 号进程拉起，当前上下文退化为 idle。","ranges":[{"file":"init/main.c","from":874,"to":896,"lines":[{"n":874,"text":"void start_kernel(void)","note":"start_kernel：通用内核初始化的总入口，由 x86_64_start_reservations 之后的路径进入。"},{"n":875,"text":"{","note":""},{"n":876,"text":"        char *command_line;","note":""},{"n":877,"text":"        char *after_dashes;","note":""},{"n":878,"text":"","note":""},{"n":879,"text":"        set_task_stack_end_magic(&init_task);","note":""},{"n":880,"text":"        smp_setup_processor_id();","note":""},{"n":881,"text":"        debug_objects_early_init();","note":""},{"n":882,"text":"        init_vmlinux_build_id();","note":""},{"n":883,"text":"","note":""},{"n":884,"text":"        cgroup_init_early();","note":""},{"n":885,"text":"","note":""},{"n":886,"text":"        local_irq_disable();","note":"先关本地中断：初始化期间屏蔽可屏蔽外部中断。"},{"n":887,"text":"        early_boot_irqs_disabled = true;","note":""},{"n":888,"text":"","note":""},{"n":889,"text":"        /*","note":""},{"n":890,"text":"         * Interrupts are still disabled. Do necessary setups, then","note":""},{"n":891,"text":"         * enable them.","note":""},{"n":892,"text":"         */","note":""},{"n":893,"text":"        boot_cpu_init();","note":""},{"n":894,"text":"        page_address_init();","note":""},{"n":895,"text":"        pr_notice(\"%s\", linux_banner);","note":""},{"n":896,"text":"        setup_arch(&command_line);","note":"setup_arch 读取 e820 内存图、建立直接映射，这是内存管理的起点。"}]},{"file":"init/main.c","from":673,"to":684,"lines":[{"n":673,"text":"static noinline void __ref __noreturn rest_init(void)","note":"rest_init：启动的后半段，负责创建 1 号与 2 号进程。"},{"n":674,"text":"{","note":""},{"n":675,"text":"        struct task_struct *tsk;","note":""},{"n":676,"text":"        int pid;","note":""},{"n":677,"text":"","note":""},{"n":678,"text":"        rcu_scheduler_starting();","note":""},{"n":679,"text":"        /*","note":""},{"n":680,"text":"         * We need to spawn init first so that it obtains pid 1, however","note":""},{"n":681,"text":"         * the init task will end up wanting to create kthreads, which, if","note":""},{"n":682,"text":"         * we schedule it before we create kthreadd, will OOPS.","note":""},{"n":683,"text":"         */","note":""},{"n":684,"text":"        pid = user_mode_thread(kernel_init, NULL, CLONE_FS);","note":"user_mode_thread(kernel_init) 创建 PID 1，之后它会 exec 成用户态的 init。"}]},{"file":"init/main.c","from":697,"to":697,"lines":[{"n":697,"text":"        pid = kernel_thread(kthreadd, NULL, NULL, CLONE_FS | CLONE_FILES);","note":"kernel_thread(kthreadd) 创建 PID 2，所有内核线程都由它派生。"}]},{"file":"init/main.c","from":717,"to":719,"lines":[{"n":717,"text":"        schedule_preempt_disabled();","note":""},{"n":718,"text":"        /* Call into cpu_idle with preempt disabled */","note":""},{"n":719,"text":"        cpu_startup_entry(CPUHP_ONLINE);","note":"当前上下文进入 cpu_startup_entry，永久成为 idle 循环。"}]}]}],"memory":{"note":"下面的数字取自 x86-64 四级页表的默认配置（4 KiB 页，47 位虚拟地址）。直接映射的基址可由 KASLR 随机化，这里用默认值演示。","ranges":[{"file":"arch/x86/include/asm/page_64_types.h","from":42,"to":42,"lines":[{"n":42,"text":"#define __PAGE_OFFSET_BASE_L4        _AC(0xffff888000000000, UL)","note":"直接映射（direct map）的基址 page_offset_base 默认值：物理内存整体线性映射到这里。"}]},{"file":"arch/x86/include/asm/page_64_types.h","from":50,"to":50,"lines":[{"n":50,"text":"#define __START_KERNEL_map        _AC(0xffffffff80000000, UL)","note":"内核镜像的虚拟基址 __START_KERNEL_map，内核代码所在的高 2 GiB。"}]}],"regions":[{"name":"用户空间","range":"0x0000000000000000 – 0x00007fffffffffff","who":"每个进程各自一份（由各自的 CR3 指向）","color":"#4cc597"},{"name":"非规范地址空洞","range":"0x0000800000000000 – 0xffff7fffffffffff","who":"CPU 拒绝此地址访问并产生 #GP","color":"#3a4542"},{"name":"直接映射 page_offset_base","range":"0xffff888000000000 起","who":"所有进程共享的内核高半部；物理地址 pa 对应 va = base + pa","color":"#5aa7e0"},{"name":"vmalloc / vmemmap 区","range":"内核高半部中段","who":"vmalloc 连续虚拟地址；vmemmap 是 struct page 数组","color":"#e3c26b"},{"name":"内核镜像 __START_KERNEL_map","range":"0xffffffff80000000 起","who":"内核 .text/.data，物理加载到 16 MiB 时 va = 0xffffffff81000000","color":"#e07a5a"}],"physical":[{"name":"实存 0 – 1 MiB","desc":"实模式向量、BIOS 与早期数据，按固件保留区和早期资源的生命周期管理"},{"name":"实存 1 MiB – 16 MiB","desc":"内核的 bzImage 解压区与早期缓冲，之后交给 memblock / 伙伴系统"},{"name":"实存 16 MiB 起","desc":"解压后的 vmlinux 镜像，之后是 struct page 与各类动态分配的页"}],"rules":["直接映射：va = page_offset_base + pa，内核按此公式计算直接映射虚拟地址，CPU 再按页表翻译，内核的 kmalloc 和 alloc_pages 返回的就是这类地址。","内核镜像映射：va = __START_KERNEL_map + pa，因此镜像的虚拟地址与物理加载地址相差一个固定偏移。","用户地址：每个进程的低半部映射不同；内核高半部在所有进程页表中相同（见 head64.c:486 的拷贝），本演示的 PTI 关闭配置复用内核高半部映射。","页表遍历：虚拟地址的第 47 到 12 位切成 4 段 9 位索引（PML4、PDPT、PD、PT），最后 12 位是页内偏移。"]},"regs":{"intro":"这四个寄存器决定 CPU 的工作模式：CR0 控制保护模式与分页，CR4 打开扩展特性，EFER 管理长模式与 syscall，RFLAGS 保存运算结果与中断、方向等状态。下面每一项列出位含义，以及 boot 和内核初始化中真实的设置代码。","items":[{"name":"CR0","full":"Control Register 0（控制寄存器 0）","role":"全局工作模式开关。PE 决定是否处于保护模式，PG 决定是否开启分页（地址翻译），WP 决定内核能否写只读页，NE、AM、MP、EM、TS 控制浮点与对齐相关异常。CR0 控制分页模式，页表根地址由 CR3 指定。","bits":[[0,"PE","保护模式使能，引导器跳入内核时已为 1"],[1,"MP","监控协处理器，与 TS 配合决定 wait 是否触发 #NM"],[2,"EM","x87 仿真，有 FPU 的机器上为 0"],[3,"TS","任务已切换，置 1 时首次使用 FPU 触发 #NM，现代内核基本为 0"],[4,"ET","扩展类型，现代 CPU 恒为 1"],[5,"NE","x87 错误以 #MF 异常原生报告"],[16,"WP","1 时内核写只读页也触发 #PF，写时复制依赖它"],[18,"AM","允许 RFLAGS.AC 生效的对齐检查"],[29,"NW","非写透，与 CD 配合控制缓存，正常为 0"],[30,"CD","禁用缓存，正常为 0"],[31,"PG","分页使能：置 1 后所有地址经 CR3 翻译"]],"boot":[{"file":"arch/x86/kernel/head_64.S","from":399,"to":401,"lines":[{"n":399,"text":"        movl        $CR0_STATE, %eax","note":"把 CR0_STATE（PE、MP、ET、NE、WP、AM、PG 的组合）装入 %eax。"},{"n":400,"text":"        /* Make changes effective */","note":""},{"n":401,"text":"        movq        %rax, %cr0","note":"写入 CR0。此时 PG 已由压缩阶段置位，写入后 WP、NE、AM 等位才在内核中生效。"}]}],"effect":"PE 与 PG：开启分页后，CPU 每次访存都经 CR3 指向的页表翻译（见虚存分区）。WP：写时复制（fork 后父子共享只读页）依赖它，关闭则内核可直接改只读页。syscall 与中断：入口和返回路径保持 CR0 原值。缺页：PG 与 WP 决定哪些访问会触发 #PF。"},{"name":"CR4","full":"Control Register 4（控制寄存器 4）","role":"打开各种扩展特性的开关。PAE 是长模式的前提，PGE 控制全局页，PCIDE 让 TLB 按进程区分，SMEP、SMAP 限制内核访问用户内存，FSGSBASE、OSXSAVE 用于指令扩展。内核在 cr4_init 中统一写入它。","bits":[[4,"PSE","页大小扩展，长模式下大页由页表项的 PS 位决定"],[5,"PAE","物理地址扩展，页表项扩为 64 位，长模式必需"],[6,"MCE","机器检查异常使能"],[7,"PGE","全局页，内核映射写 CR3 时保留在 TLB 中"],[9,"OSFXSR","操作系统支持 FXSAVE 与 SSE"],[10,"OSXMMEXCPT","SSE 浮点异常以 #XM 报告"],[11,"UMIP","用户态执行 sgdt、sidt 等触发 #GP"],[12,"LA57","5 级页表，本演示按 4 级走读，因此为 0"],[16,"FSGSBASE","允许直接读写 FS、GS 基址"],[17,"PCIDE","CR3 低 12 位作为 PCID，切换进程时 TLB 可按 PCID 保留"],[18,"OSXSAVE","允许 XSAVE、XRSTOR，保存 AVX 等扩展状态"],[20,"SMEP","内核态取指落在用户页上即 #PF"],[21,"SMAP","内核态读写用户页即 #PF，除非 RFLAGS.AC=1"]],"boot":[{"file":"arch/x86/kernel/head_64.S","from":201,"to":201,"lines":[{"n":201,"text":"        movl        $(X86_CR4_PAE | X86_CR4_LA57), %edx","note":"把 PAE 与 LA57 装入掩码 %edx，之后 CR4 只保留这些位。PGE 故意不在掩码中，以便刷新全局页。"}]},{"file":"arch/x86/kernel/head_64.S","from":215,"to":217,"lines":[{"n":215,"text":"        /* Even if ignored in long mode, set PSE uniformly on all logical CPUs. */","note":""},{"n":216,"text":"        btsl        $X86_CR4_PSE_BIT, %ecx","note":"btsl 置 PSE，长模式虽然忽略它，也要在所有 CPU 上保持一致。"},{"n":217,"text":"        movq        %rcx, %cr4","note":"写入 CR4，此时 PAE 仍为 1。"}]},{"file":"arch/x86/kernel/head_64.S","from":221,"to":223,"lines":[{"n":221,"text":"         */","note":""},{"n":222,"text":"        btsl        $X86_CR4_PGE_BIT, %ecx","note":"btsl 置 PGE，重新启用全局页。"},{"n":223,"text":"        movq        %rcx, %cr4","note":"再次写入 CR4，全局映射生效。"}]},{"file":"arch/x86/boot/compressed/head_64.S","from":168,"to":171,"lines":[{"n":168,"text":"        /* Enable PAE mode */","note":""},{"n":169,"text":"        movl        %cr4, %eax","note":""},{"n":170,"text":"        orl        $X86_CR4_PAE, %eax","note":"orl 置 PAE：长模式要求页表项为 64 位。"},{"n":171,"text":"        movl        %eax, %cr4","note":"写回 CR4。这是 CR4 在引导过程中第一次被置位的地方（压缩阶段）。"}]},{"file":"arch/x86/kernel/cpu/common.c","from":366,"to":369,"lines":[{"n":366,"text":"{","note":""},{"n":367,"text":"        if (cpu_has(c, X86_FEATURE_SMEP))","note":""},{"n":368,"text":"                cr4_set_bits(X86_CR4_SMEP);","note":"cr4_set_bits 置 SMEP，内核执行用户页即触发 #PF。"},{"n":369,"text":"}","note":""}]},{"file":"arch/x86/kernel/cpu/common.c","from":377,"to":380,"lines":[{"n":377,"text":"","note":""},{"n":378,"text":"        if (cpu_has(c, X86_FEATURE_SMAP))","note":""},{"n":379,"text":"                cr4_set_bits(X86_CR4_SMAP);","note":"cr4_set_bits 置 SMAP，内核读写用户页即触发 #PF（除非 AC 置位）。"},{"n":380,"text":"}","note":""}]},{"file":"arch/x86/kernel/cpu/common.c","from":474,"to":481,"lines":[{"n":474,"text":"void cr4_init(void)","note":""},{"n":475,"text":"{","note":""},{"n":476,"text":"        unsigned long cr4 = __read_cr4();","note":""},{"n":477,"text":"","note":""},{"n":478,"text":"        if (boot_cpu_has(X86_FEATURE_PCID))","note":""},{"n":479,"text":"                cr4 |= X86_CR4_PCIDE;","note":"若 CPU 支持 PCID，置位 CR4.PCIDE。"},{"n":480,"text":"        if (static_branch_likely(&cr_pinning))","note":""},{"n":481,"text":"                cr4 = (cr4 & ~cr4_pinned_mask) | cr4_pinned_bits;","note":""}]}],"effect":"PAE 与 PGE：决定页表格式与全局 TLB 的行为，是地址翻译的基础。PCIDE：写 CR3 切换进程时，TLB 表项按 PCID 区分并按有效性条件保留。SMEP、SMAP：系统调用与缺页路径中，内核访问用户指针若违规会触发 #PF。UMIP：限制用户态读取内核描述符表。LA57：本演示未启用，仍是 4 级页表（47 位虚拟地址）。"},{"name":"EFER","full":"Extended Feature Enable Register（扩展功能使能寄存器，MSR 0xC0000080）","role":"EFER 是模型专用寄存器（MSR），用 rdmsr、wrmsr 访问。LME 与 LMA 决定是否进入长模式，SCE 允许 syscall 与 sysret，NXE 允许页表项的 NX 位生效。","bits":[[0,"SCE","允许 syscall、sysret 指令，为 0 时执行 syscall 会 #UD"],[8,"LME","长模式使能：软件置 1，真正进入长模式还要求 CR0.PG=1"],[10,"LMA","长模式激活：只读，LME 与 PG 同时为 1 时由 CPU 置位"],[11,"NXE","页表项第 63 位 NX 生效，标记 NX 的页上取指触发 #PF"],[12,"SVME","允许 AMD SVM 虚拟化扩展"]],"boot":[{"file":"arch/x86/kernel/head_64.S","from":379,"to":389,"lines":[{"n":379,"text":"        movl        $MSR_EFER, %ecx","note":"ecx 装入 MSR_EFER（0xC0000080），后面的 rdmsr、wrmsr 都用它。"},{"n":380,"text":"        rdmsr","note":""},{"n":381,"text":"        /*","note":""},{"n":382,"text":"         * Preserve current value of EFER for comparison and to skip","note":""},{"n":383,"text":"         * EFER writes if no change was made (for TDX guest)","note":""},{"n":384,"text":"         */","note":""},{"n":385,"text":"        movl    %eax, %edx","note":""},{"n":386,"text":"        btsl        $_EFER_SCE, %eax        /* Enable System Call */","note":"btsl 置 SCE，允许 syscall 与 sysret。"},{"n":387,"text":"        btl        $20,%edi                /* No Execute supported? */","note":""},{"n":388,"text":"        jnc     1f","note":""},{"n":389,"text":"        btsl        $_EFER_NX, %eax","note":"btsl 置 NX，仅当 CPU 支持 NX（%edi 第 20 位）时执行。"}]},{"file":"arch/x86/boot/compressed/head_64.S","from":239,"       text: '一个进程的全部内存映射记在一棵树上，每个节点是一段连续映射（行业里叫 VMA，记录这段地址干什么用、来自哪个文件）。映射先只登记"约定"，真正的物理内存页要等第一次访问被拦下（缺页）时才补上；fork 时把可写私有的页先标成只读，谁要写谁再单独复制一份，这叫写时复制。',
      objs: [['struct mm_struct', '一个进程的地址空间总档案', 'include/linux/mm_types.h:struct mm_struct'], ['struct vm_area_struct', '一段连续映射的说明：起止地址、权限、来自哪个文件', 'include/linux/mm_types.h:struct vm_area_struct']],
      src: ['mm/memory.c:handle_mm_fault', 'mm/memory.c:do_wp_page', 'kernel/fork.c:dup_mmap'] },
    { id: 'alloc', name: '页与对象分配', zone: 'mm', code: 'buddy · SLUB · kswapd', at: [4, 4, 3],
      text: '伙伴系统按 2 的幂（1、2、4、8……页）分配整块物理内存；SLUB 在这些页上切成小格子，分给内核里的小结构体（任务档案、目录项、I/O 请求等）。空闲内存低于警戒线时，叫醒 kswapd 去回收。',
      objs: [['struct folio', '页缓存里的一个管理单元：可能是 1 页，也可能是连着的几页', 'include/linux/mm_types.h:struct folio'], ['struct kmem_cache', 'SLUB 的一种小对象仓库，专放同一类结构体', 'mm/slab.h:struct kmem_cache']],
      src: ['mm/page_alloc.c:__alloc_pages_noprof', 'mm/slub.c:kmem_cache_alloc_noprof', 'mm/vmscan.c:balance_pgdat'] },
    { id: 'wq', name: '工作队列', zone: 'irq', code: 'queue_work → kworker', at: [4, 7, 3],
      text: '需要在可睡眠上下文执行的工作，用 work_struct 记录回调并交给 kworker 线程。终端字符转交、脏页写回和部分延后清理通过工作队列完成。',
      objs: [['struct work_struct', '一张待办便条：上面写着要调用哪个函数', 'include/linux/workqueue_types.h:struct work_struct']],
      src: ['kernel/workqueue.c:__queue_work', 'kernel/workqueue.c:worker_thread', 'kernel/workqueue.c:process_one_work'] },
    { id: 'rcu', name: 'RCU', zone: 'irq', code: 'rcu_sched_clock_irq · rcu_core', at: [4, 10, 3],
      text: 'RCU 用读侧临界区和宽限期协调并发访问：写侧替换对象后登记回调，等相关旧读者安全离开再执行回收。目录项和任务档案等对象按各自的 RCU 与引用计数规则管理生命周期。',
      objs: [['struct rcu_head', '挂在待释放对象身上的一个小钩子，等宽限期过去后由它触发释放', 'include/linux/types.h:struct callback_head']],
      src: ['kernel/rcu/tree.c:rcu_sched_clock_irq', 'kernel/rcu/tree.c:rcu_core', 'kernel/rcu/tree.c:rcu_do_batch'] },

    { id: 'vfs', name: 'VFS（文件系统的公共外壳）', zone: 'fs', code: 'path walk · dentry · inode · file', at: [5, 1, 3],
      text: '所有文件系统共用的一层。路径按斜杠切成一段段名字，在目录项缓存里查每一段对应哪个文件对象；一次 open 得到一份"打开实例"，之后的读写都经这份实例的操作表分派到具体文件系统。',
      objs: [['struct dentry', '一段名字与一个文件对象的对应关系', 'include/linux/dcache.h:struct dentry'], ['struct inode', '文件本身：权限、大小、数据放在哪', 'include/linux/fs.h:struct inode'], ['struct file', '一次打开：读到哪了、以什么方式打开', 'include/linux/fs.h:struct file']],
      src: ['fs/namei.c:link_path_walk', 'fs/namei.c:path_openat', 'fs/read_write.c:vfs_read'] },
    { id: 'pcache', name: '页缓存与写回', zone: 'fs', code: 'address_space · filemap_read · wb_workfn', at: [5, 4, 3],
      text: '文件内容按页缓存在内存里（挂在 inode 的页缓存表上）。读文件先查缓存，没命中才去磁盘读；写文件只是把页标记成"脏"，由回写线程每 5 秒或超过阈值时刷下去。',
      objs: [['struct address_space', '一个文件的页缓存表（按文件内偏移索引）', 'include/linux/fs.h:struct address_space'], ['struct bdi_writeback', '一个设备的回写进度与状态', 'include/linux/backing-dev-defs.h:struct bdi_writeback']],
      src: ['mm/filemap.c:filemap_read', 'mm/readahead.c:page_cache_ra_unbounded', 'fs/fs-writeback.c:wb_workfn'] },
    { id: 'tty', name: 'TTY 与行规程', zone: 'tty', code: 'tty_struct · n_tty', at: [5, 7, 3],
      text: '终端设备和进程之间的一层。键盘字符先进入一个过渡缓冲区，再交给行规程：行规程负责回显你敲的字、处理退格，并且"规范模式下攒够一整行"才交给正在读取的程序，然后叫醒睡在 read 上的进程。',
      objs: [['struct tty_struct', '一个已经打开的终端', 'include/linux/tty.h:struct tty_struct'], ['struct n_tty_data', '行规程的环形缓冲与读写位置指针', 'drivers/tty/n_tty.c:struct n_tty_data']],
      src: ['drivers/tty/tty_buffer.c:flush_to_ldisc', 'drivers/tty/n_tty.c:n_tty_receive_char', 'drivers/tty/n_tty.c:n_tty_read'] },
    { id: 'vt', name: '虚拟终端 VT', zone: 'tty', code: 'kbd_event · con_write · vgacon', at: [5, 10, 3],
      text: 'tty1 背后的驱动。输入侧按当前键盘布局把键号翻成字符、送进终端；输出侧解释控制字符，把内容画进屏幕缓冲。当前显示的那个虚拟终端的缓冲，就是显卡文本模式下的显存。',
      objs: [['struct vc_data', '一个虚拟控制台：光标位置、字符属性、屏幕缓冲', 'include/linux/console_struct.h:struct vc_data']],
      src: ['drivers/tty/vt/keyboard.c:kbd_event', 'drivers/tty/vt/vt.c:do_con_write', 'drivers/video/console/vgacon.c'] },

    { id: 'ext4', name: 'ext4 文件系统与 jbd2 日志', zone: 'fs', code: 'ext4_lookup · ext4_map_blocks', at: [6, 1, 3],
      text: '把"文件里的第几块"换算成"磁盘上的第几块"（用 extent 树记录连续区间），并把目录项、元数据的改动先记进日志事务，保证断电后还能恢复。数据读写只在缓存没命中或回写时才走到它。',
      objs: [['struct ext4_extent', '一段连续的逻辑块到物理块的对应关系', 'fs/ext4/ext4_extents.h:struct ext4_extent'], ['transaction_t', 'jbd2 日志里的一个事务：一批要一起生效的改动', 'include/linux/jbd2.h:struct transaction_s']],
      src: ['fs/ext4/namei.c:ext4_lookup', 'fs/ext4/inode.c:ext4_map_blocks', 'fs/jbd2/journal.c:kjournald2'] },
    { id: 'blk', name: '块层 blk-mq', zone: 'blk', code: 'submit_bio → blk_mq_submit_bio', at: [6, 4, 3],
      text: 'bio 描述"把这几页数据送到磁盘的这些扇区"或反过来。blk-mq 把请求合并、排序，放进每颗 CPU 的软件队列，再派发给驱动的硬件队列。设备做完后，沿提交时登记的回调一层层往上通知。',
      objs: [['struct bio', '一次块设备读写：涉及哪些内存页、从哪个扇区开始、做完调用谁', 'include/linux/blk_types.h:struct bio'], ['struct request', '真正派发给驱动执行的单位（可由多个 bio 合并而来）', 'include/linux/blk-mq.h:struct request']],
      src: ['block/blk-core.c:submit_bio', 'block/blk-mq.c:blk_mq_submit_bio', 'block/blk-mq.c:blk_mq_end_request'] },
    { id: 'input', name: '输入子系统', zone: 'tty', code: 'input_event → input_pass_values', at: [6, 7, 3],
      text: '把各种键盘、鼠标统一成"类型 + 代码 + 值"三个数。设备驱动报事件（比如"键 C 被按下"），核心按已建立的连接分发给关心它的人：虚拟终端键盘、以及 /dev/input/eventN 这个接口。',
      objs: [['struct input_event', '用户程序从 /dev/input/eventN 读到的结构', 'include/uapi/linux/input.h:struct input_event'], ['struct input_handler', '一个"关心输入的人"：虚拟终端键盘一个、事件接口一个', 'include/linux/input.h:struct input_handler']],
      src: ['drivers/input/input.c:input_event', 'drivers/input/input.c:input_pass_values'] },
    { id: 'wbdev', name: '定时与后台线程', zone: 'task', code: 'kthreadd · kswapd · jbd2 · ksoftirqd', at: [6, 10, 3],
      text: '2 号任务（内核线程工厂）派生出来的长期后台线程。它们平时睡着，被定时器、内存警戒线或日志提交叫醒。系统空闲下来之后，剩下的"自发活动"基本都在这里。',
      objs: [['struct kthread', '内核线程的附加档案（有没有在跑、要不要停）', 'kernel/kthread.c:struct kthread']],
      src: ['kernel/kthread.c:kthreadd', 'mm/vmscan.c:kswapd', 'kernel/softirq.c:run_ksoftirqd'] },

    { id: 'vblk', name: 'virtio-blk 驱动', zone: 'blk', code: 'virtio_queue_rq · virtblk_done', at: [7, 1, 4],
      text: '把请求变成一串放在共享内存里的说明（描述符链：请求头、数据页、状态字节），再写一个寄存器"敲一下门铃"。设备做完后，从"已完成"的环里把结果取回来。',
      objs: [['struct virtqueue', '驱动和设备共享的一圈说明：待做清单加已完成清单', 'include/linux/virtio.h:struct virtqueue']],
      src: ['drivers/block/virtio_blk.c:virtio_queue_rq', 'drivers/block/virtio_blk.c:virtblk_done', 'drivers/virtio/virtio_ring.c:vring_interrupt'] },
    { id: 'kbdrv', name: 'i8042 / atkbd 键盘驱动', zone: 'tty', code: 'i8042_interrupt → atkbd_receive_byte', at: [7, 5, 4],
      text: 'i8042 是键盘控制器（8042 芯片）的驱动：中断里从 0x60 这个端口读出一个字节，交给下一层。atkbd 是键盘协议驱动：把按键的原始编码翻成统一的键编号，报给输入子系统。',
      objs: [['struct atkbd', '键盘状态和一张"原始编码到键编号"的对照表', 'drivers/input/keyboard/atkbd.c:struct atkbd']],
      src: ['drivers/input/serio/i8042.c:i8042_interrupt', 'drivers/input/keyboard/atkbd.c:atkbd_receive_byte'] },
    { id: 'apic', name: '本地 APIC', zone: 'irq', code: 'sysvec_apic_timer_interrupt', at: [7, 9, 4],
      text: '每颗 CPU 内部自带的中断控制器，里面还有一个闹钟。内核把"下一次该在什么时候醒"写给它，到点就产生一个固定编号的中断。',
      objs: [['clock_event_device', '一个可编程的"到点通知"来源', 'include/linux/clockchips.h:struct clock_event_device']],
      src: ['arch/x86/kernel/apic/apic.c:sysvec_apic_timer_interrupt', 'arch/x86/kernel/apic/apic.c:lapic_next_deadline'] },

    { id: 'disk', name: '虚拟磁盘', zone: 'hw', code: 'QEMU virtio-blk-pci', at: [8, 1, 4],
      text: 'QEMU 这一侧虚拟出来的磁盘：它看驱动交办的清单，从宿主机上的镜像文件读写数据，把结果写回已完成的那一圈，再发一个中断通知 CPU。',
      objs: [], src: ['include/uapi/linux/virtio_blk.h:struct virtio_blk_outhdr'] },
    { id: 'kbd', name: '键盘 + 8042 控制器', zone: 'hw', code: 'IRQ 1 · 端口 0x60 / 0x64', at: [8, 5, 4],
      text: '按下或松开一个键，键盘就发出一段原始编码（行业里叫扫描码）；8042 控制器把它转换后放进自己的输出缓冲，并拉高第 1 号中断线，通知 CPU 来取。',
      objs: [], src: ['drivers/input/serio/i8042.h'] },
    { id: 'screen', name: 'VGA 文本显存', zone: 'hw', code: '0xB8000 · 80×25', at: [8, 9, 4],
      text: '文本模式下屏幕被当成 80 列 × 25 行的字符网格，每个格子占两个字节：一个字符码、一个颜色属性。当前显示的那个虚拟终端，它的屏幕缓冲就在这块显存里，写进去显示器就看得见。',
      objs: [], src: ['drivers/video/console/vgacon.c'] },
  ],

            say: 'copy_process 负责造这个新任务：从 SLUB 拿一块 task_struct（进程的「身份证」），再从 vmalloc 区申请 16 KiB 当它的内核栈（这模式叫 VMAP_STACK：栈的两头各留一块没映射的地址当围墙，万一栈写溢出，会立刻触发 #PF 报错，而不是悄悄把别人内存踩坏）。最后在新栈顶伪造出一帧「假现场」，这样它第一次被调度上来时，会像是从一个函数返回一样，从 ret_from_fork 开始执行。' },

        /* 8 virtio-blk 与 ext4 登记 */

            say: 'PCI 总线扫描时，内核读到一块设备的厂商标识是 0x1af4、设备标识是 0x1042，认出这是 virtio 1.0 标准的虚拟磁盘。驱动接着通过这个设备 BAR 窗口里的「通用配置区」去读它支持哪些特性，再把自己愿意接受的那部分写回去，同时按规矩把设备状态一步步推进：ACKNOWLEDGE（我认领你了）→ DRIVER（我知道驱动是谁了）→ FEATURES_OK（特性协商谈好了）。' },
          { at: 2, mem: { 'p.vq': '虚拟磁盘的队列区：描述符表 desc[128] / 驱动交办环 avail / 设备完成环 used' }, dev: { vq: { st: 'DRIVER_OK（驱动已就绪）', desc: '空闲（还没派任务）', avail: 0, used: 0 } }, x: [['p.free', 'p.vq', '分配这三块环内存（设备也能直接访问）'], ['cpu', 'virtio', '把队列物理地址和 MSI-X 表项写给设备', 'r.RAX']],
            say: 'split virtqueue（「拆开的」虚拟队列）是驱动和设备共用的一块约定内存，分三部分：描述符表（一条条任务，写明数据在哪个地址、多长、什么标志）、avail 环（驱动写好任务后，在这里告诉设备「该做第几条了」）、used 环（设备做完后在另半边告诉驱动「哪几条干完了」）。驱动要把这三块内存的物理地址告诉设备，设备才能找到它们。MSI-X 那张表项里写的其实是一个地址加一个号码：「完事之后，往 0xFEE00000 写这个号码」——设备照做，对 CPU 来说就是一次中断。' },

          { at: 4, mem: { 'p.slab': '又多了 ext4 专用的几个内存池（比如 ext4_inode_cache）' }, say: 'ext4_init_fs 只做两件事：给 ext4 用到的几种数据结构建好内存池，然后向内核登记「我这种文件系统叫 ext4，以后碰到 ext4 的盘就归我管」。盘面读取由后续挂载和文件访问触发。' },

          { at: 3, dev: { kbd: { ctr: '0x47：中断开、键盘开、扫描码翻译开', st: '0x1c（无数据待读）' }, ioapic: { pin1: '→ 送 CPU0，中断号 0x31，边沿触发' } }, x: [['cpu', 'kbd', '往 0x64 发命令 0x20（要读命令字节）', 'r.RAX'], ['kbd', 'cpu', '从 0x60 读回命令字节', 'r.RAX'], ['cpu', 'ioapic', '设置第 1 脚的重定向表项', 'r.RAX']],

          { at: 4, x: [['cpu', 'kbd', '发 0xF2 读键盘 ID，回 0xAB 0x83', 'r.RAX'], ['cpu', 'kbd', '发 0xF4 让键盘开始扫描', 'r.RAX']], say: '键盘驱动 atkbd 先往键盘发命令 0xF2 问「你是谁」（AT 键盘回 0xAB 0x83），再设置指示灯和长按重复率，最后发 0xF4 让键盘正式开始扫描按键。' },

        [

          { at: 5, mem: { 'p.pc': 'vda 的页缓存里多了块 0：超级块，此刻被锁住、正在从磁盘读' } },

            cpu: { task: 'swapper/0', hlt: true }, r: { RSP: IDLE_SP, RIP: ['default_idle → hlt', '1 号睡下了，CPU 也停住'] }, stk: { name: 'swapper/0 的栈', items: [] },
            say: '一次读操作被拆成 3 个描述符，串成一条链：第一个是只读的「请求头」（写明这次是读、从哪个扇区开始），第二个是留给设备写数据的那一页，第三个是留给设备写 1 个字节状态的位置。把链头放进 avail 环、序号加一之后，驱动再去写 notify 寄存器「敲一下门铃」：在这台虚拟机里，这次写设备寄存器的动作会让虚拟机退出（VM exit），把控制权交给外面的 QEMU。此刻 1 号任务因为等 I/O 进入 TASK_UNINTERRUPTIBLE（不可打断睡眠），运行队列空了，CPU 只好执行 hlt 停下来省电。' },

            x: [['virtio', 'p.vq', '读出描述符链'], ['disk', 'p.pc', '把 4 KiB 写进内存（DMA）'], ['virtio', 'p.vq', '写状态 0，完成序号 +1'], ['virtio', 'apic', '按 MSI-X 表项往 0xFEE00000 写中断号']],

          { at: 8, ...IRQ('0x24', 'default_idle（hlt 之后）', 'swapper/0 的栈'), x: [['apic', 'cpu', '递交中断号 0x24', 'fl.IF'], ['cpu', 'apic', '写 EOI（表示已收下）', 'r.RAX']], dev: { apic: { irr: '—', isr: '—（已经应答过了）' } },

          { at: 3, mem: { 'p.pc': '页缓存里多了 busybox 的第 0 页（装着 ELF 头和程序头表）' }, x: [['p.pc', 'cpu', '读 ELF 头和程序头表', 'r.RAX']], say: '读文件开头的「ELF 头」和「程序头表」——这是可执行文件自我介绍的部分：里面写着有两段要装进内存（两个 PT_LOAD），一段是代码（权限为读取和执行），一段是数据（可读写）；本例使用静态链接 ELF，内核直接进入其入口地址。' },

            say: 'start_thread 做的只是改一改内核栈上那份 pt_regs（刚才存下来的用户寄存器快照）：把返回地址改成 ELF 的入口地址、把栈指针改成新用户栈、把段寄存器改成用户段。真正回到用户态靠的是 iretq 指令：CPU 会依次把 RIP、CS（0x33，RPL=3 表示用户态）、RFLAGS、RSP、SS 弹回去，特权级 CPL 就从 0 变成 3；返回之前还要 swapgs，把 GS 换回用户那套。' },

          { at: 0, walk: { va: '0x401000', res: ['空 → #PF', '', '', ''] }, say: 'MMU（CPU 里管地址转换的部件）先按 CR3 找到最顶层的页表 PML4，然后从虚拟地址 0x401000 里取出第 47–39 位当下标（这里算出来是 0），去查那一项：是空的——因为这个新地址空间的用户半部连一张下级页表都还没建。地址翻译不下去，取指令失败，于是产生一次 #PF（缺页异常）。' },

          { at: 2, fl: { IF: 1 }, walk: { va: '0x401000', res: ['新建 PDPT', '新建 PD', '新建 PT', '空：等着填写'] }, mem: { 'p.pgt': '多了 init(1) 的 PDPT、PD、PT 各一页' }, x: [['p.free', 'p.pgt', '分配 3 张页表页']],

  /* normalize: boot ops must have one entry per lesson step, and each `at` must index a real call of that step */
  const _stories = (window.KDATA && window.KDATA.stories) || []
  for (const st of _stories) {
    const ops = window.KMACHINE.ops[st.id]
    if (!ops) continue
    while (ops.length < st.steps.length) ops.push([])
    ops.length = st.steps.length
    st.steps.forEach((s, i) => {
      const max = Math.max(1, s.calls ? s.calls.length : 1)
      for (const op of ops[i] || []) if ((op.at ?? 0) >= max) op.at = max - 1
    })
  }
})()

      `<rect class="b8k" x="${PH.cx + 11 * PH.cw - 0.5}" y="${ZY - 0.5}" width="${PH.cw}" height="14"><title>0xB8000：屏幕文字在内存里的存放位置（80 列 × 25 行 × 2 字节）</title></rect>`)

    /* devices */

    o.push(box(DEV.apic.y, DEV.apic.h, '中断控制器：本地 APIC · IO-APIC（外部设备的中断汇总到这里）'))
    o.push(dl('apic', 'irr', '等待处理', 1222, 40), dl('apic', 'isr', '正在处理', 1410, 40), dl('apic', 'timer', '定时器', 1222, 60), dl('apic', 'icr', 'ICR 通知别的 CPU', 1222, 80), dl('ioapic', 'pin1', 'IO-APIC 脚 1', 1222, 104))

      const sig = g.dataset.k + '|' + el._key
      if (tipK !== sig) { tipK = sig; tip.innerHTML = tipHtml(g, el.curS) }
      tip.style.display = 'block'
      const R = root.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight
      let x = e.clientX - R.left + 16, y = e.clientY - R.top + 16
      if (x + w > R.width - 6) x = e.clientX - R.left - w - 12
      if (y + h > R.height - 6) y = Math.max(4, e.clientY - R.top - h - 12)

  }
  /* 整块寄存器的当前值：把为 1 的位按位号加起来，拼成一个十六进制数 */
  function regHex(grp, S) {
    if (grp === 'fl') return rflagsHex(S.fl)
    let v = 0n
    for (const [b, no] of BITS[grp][1]) if (S[grp][b]) v |= 1n << BigInt(no)
    return '0x' + v.toString(16).toUpperCase()
  }
  const regOnes = (grp, S) => BITS[grp][1].filter(([b]) => S[grp][b]).map(([b, no]) => `${b}（第 ${no} 位）`).join('、') || '各位均为 0'
  /* 设备区域里那些缩写的中文说明 */
  const DEVCN = { apic: '中断控制器：本地 APIC + IO-APIC', ioapic: 'IO-APIC：汇总外部设备的中断线', kbd: '键盘控制器 i8042（PS/2 键盘）', virtio: '虚拟磁盘控制器 virtio-blk', vq: '虚拟队列 virtqueue：驱动与磁盘之间传递任务的地方', disk: '虚拟磁盘 vda：宿主机上的一个镜像文件' }

  function tipHtml(g, S) {
    const k = g.dataset.k, key = k.split('.'), grp = key[0], name = key[1], sub = key[2]
    let t = TIP_PLAIN[k] || TIP[k]
    let head = name, where = '', val = ''
    if (grp === 'g') {
      const r = TIP_REG[name] || [name, name, '']
      const ones = S ? regOnes(name, S) : ''
      return `<div class="th"><b>${esc(r[1])}</b><span>${esc(r[0])}</span></div>` +
        (S ? `<div class="tv">当前值 = ${esc(regHex(name, S))}；其中为 1 的位：${esc(ones)}</div>` : '') +
        `<p>${esc(r[2])}</p>`
    }
    if (grp === 'dev') {
      t = t || [sub, '', '']
      head = sub
      where = `${DEVCN[name] || name} · 字段名 ${sub}`
      const v = S?.dev?.[name]?.[sub]
      val = v != null && v !== '' ? `当前 = ${v}` : ''
    } else if (TIP_GROUP[grp]) {
      t = t || [name, '', '']
      where = `${TIP_GROUP[grp]} 第 ${g.dataset.bit} 位（二进制位从最右边数起，最右一位算第 0 位）`
      val = S ? `当前 = ${S[grp][name] ? 1 : 0}` : ''
    } else {
      t = t || [name, '', '']
      const reg = REGS.find((r) => r[0] === name)
      where = grp === 'c' ? g.dataset.hint : reg?.[1] || ''
      const v = name === 'RFLAGS' ? (S ? [rflagsHex(S.fl), ''] : null) : S?.[grp][name]
      val = v ? `当前 = ${v[0]}${v[1] ? `（${v[1]}）` : ''}` : ''
    }
    return `<div class="th"><b>${esc(head)}</b><span>${esc(t[0])}</span></div><div class="tz">${esc(t[1])}<i>${esc(where)}</i></div>${val ? `<div class="tv">${esc(val)}</div>` : ''}<p>${esc(t[2])}</p>`
  }
  function dl(dev, key, label, x, y, w = 170) {
    return `<g class="dv" data-k="dev.${dev}.${key}" data-w="${w}">${label ? `<text class="dk" x="${x}" y="${y}">${esc(label)}</text>` : ''}<text class="dvv" x="${x + (label ? wid(label, 11, 6.2) + 8 : 0)}" y="${y}"></text></g>`
  }

  /* ---------- dynamic render ---------- */
  function badges(S, chg) {
    const b = [
      ['cpu.mode', '模式', MODE[S.cpu.mode] || S.cpu.mode, 112], ['cpu.cpl', '运行级别', S.cpu.cpl === 3 ? '3 用户程序' : '0 内核', 118],
      ['fl.IF', '中断开关', S.fl.IF ? '1 允许打断' : '0 屏蔽外部 IRQ', 122], ['cpu.hlt', '状态', S.cpu.hlt ? 'HLT 停着等' : '执行中', 110],
      ['sw.preempt', '禁止抢占计数', S.sw.preempt, 118], ['sw.resched', '该重新调度', S.sw.resched ? '1 是' : '0 否', 112], ['sw.softirq', '待办软中断', S.sw.softirq, 260],
    ]
    let x = 20, y = 38, out = ''
    b.forEach(([k, n, v, w], i) => {
      if (i === 4) { x = 20; y = 60 }
      const on = (k === 'cpu.cpl' && S.cpu.cpl === 3) || (k === 'fl.IF' && S.fl.IF) || (k === 'cpu.hlt' && S.cpu.hlt) || (k === 'sw.resched' && S.sw.resched) || (k === 'sw.preempt' && /IRQ/.test(v))
      out += `<g class="bdg${on ? ' on' : ''}${chg.has(k) ? ' chg' : ''}"><rect x="${x}" y="${y}" width="${w}" height="19" rx="9.5"/><text x="${x + 9}" y="${y + 13.5}"><tspan class="bk">${esc(n)}</tspan> ${esc(cut(v, w - wid(n, 10, 5.6) - 22, 10.5, 6))}</text></g>`
      x += w + 6
    })
    return out
  }
  const rflagsHex = (fl) => '0x' + (2 + Object.entries(fl).reduce((a, [b, v]) => a + (v ? 1 << BITS.fl[1].find((x) => x[0] === b)[1] : 0), 0)).toString(16)

  function spaceRegions(vs) {
    const sp = SPACES[vs] || SPACES.none
    let y = VS.y0
    const out = []
    for (const r of sp.regions) {
      if (!r) { out.push({ hole: true, y }); y += VS.hole; continue }
      out.push({ id: r[0], addr: r[1], name: r[2], to: r[3], y }); y += VS.h + VS.gap
    }
    return { sp, regs: out }
  }

  function render(el, M, g, landed, xp, T) {
    const sn = g >= 0 ? M.snaps[g] : null
    const S = landed ? (sn ? sn.S : M.init) : (g > 0 ? M.snaps[g - 1].S : M.init)
    const chg = landed && sn ? sn.chg : new Set()
    const key = `${g}|${landed}`
    if (el._key !== key) {
      el._key = key
      el.curS = S
    el.task.textContent = `当前任务：${cut(S.cpu.task, 190, 11, 6.6)}`
      el.badges.innerHTML = badges(S, chg)
      for (const [k, e] of el.regs) {
        const [grp, name, sub] = k.split('.')
        if (grp === 'r' || grp === 'c') {
          const v = name === 'RFLAGS' ? [rflagsHex(S.fl), ''] : S[grp][name] || ['—', '']
          const ctl = grp === 'c'
          e.querySelector('.rv').textContent = cut(v[0], ctl ? (name === 'CR3' ? 320 : 156) : 190, 12, 7.2)
          const h = e.querySelector('.rh'); if (h) h.textContent = cut(v[1], 238, 10.5, 6)
          e.classList.toggle('chg', chg.has(k) || (name === 'RFLAGS' && [...chg].some((x) => x.startsWith('fl.'))))
        } else if (grp === 'dev') {
          const v = S.dev[name]?.[sub] ?? '—', w = +e.dataset.w
          e.querySelector('.dvv').textContent = cut(v, w, 11, 6.4)
          e.classList.toggle('chg', chg.has(k))
        } else {
          e.classList.toggle('on', !!S[grp]?.[name])
          e.classList.toggle('chg', chg.has(k))
        }
      }
      const hot = new Set()
      if (sn && landed) { for (const c of chg) if (c.startsWith('mem.')) hot.add(c.slice(4)); for (const v of sn.va) hot.add(v[1]) }
      if (sn) for (const x of sn.xs) for (const p of [x[0], x[1]]) if (PNAME[p]) hot.add(p)
      for (const [id, e] of el.phys) {
        e.classList.toggle('hot', hot.has(id)); e.classList.toggle('chg', chg.has('mem.' + id)); e.classList.toggle('dim', hot.size > 0 && !hot.has(id))
        e.querySelector('title').textContent = `${PNAME[id]}\n${e.dataset.r}${S.mem[id] ? '\n' + S.mem[id] : ''}`
      }
      for (const e of el.legs) e.classList.toggle('hot', hot.has(e.dataset.l))
      const seen = new Set(), list = (sn ? sn.acc : []).filter((a) => { const k = a.id + a.rw; return !seen.has(k) && seen.add(k) }).slice(0, 3)
      const NS = sn ? sn.S : S
      el.pcall.innerHTML = list.length
        ? list.map((a, i) => {
          const head = `${a.rw === 'w' ? '写' : '读'} ${PNAME[a.id].split(/[（(]/)[0]} ${a.exact ? '@' : '≈'}${hx(a.a)}`
          return `<text class="pcl" x="${PH.x}" y="${ZY + 106 + i * 13}"><tspan class="pcn ${a.rw}">${a.rw === 'w' ? '●' : '○'} ${esc(head)}</tspan> ${esc(cut((a.rw === 'w' && sn.chg.has('mem.' + a.id) ? NS.mem[a.id] : a.label) || NS.mem[a.id] || '', 296 - wid(head, 11, 6.4) - 18, 11, 6.2))}</text>`
        }).join('')
        : `<text class="pcl muted" x="${PH.x}" y="${ZY + 106}">这一跳仅展示寄存器或控制状态变化</text>`
      /* virtual space and mappings */
      const { sp, regs } = spaceRegions(S.vs)
      el.vsname.textContent = `虚拟地址空间 · ${sp.name}`
      el.vsnote.textContent = sp.note || ''
      const vaHot = new Map((sn && landed ? sn.va : []).map((v) => [v[0], v[1]]))
      el.vs.innerHTML = regs.map((r) => r.hole ? `<text class="hole" x="${VS.x + VS.w / 2}" y="${r.y + 16}">· · · 空洞：此段为地址空洞，访问会触发地址异常 · · ·</text>`
        : `<g class="vreg${vaHot.has(r.id) ? ' hot' : ''}"><rect x="${VS.x}" y="${r.y}" width="${VS.w}" height="${VS.h}" rx="5"/><text class="pn" x="${VS.x + 8}" y="${r.y + 16}">${esc(cut(r.name, 236, 11.5, 6.6))}</text><text class="pa" x="${VS.x + 8}" y="${r.y + 34}">${esc(r.addr)}</text></g>`).join('') +
        (regs.length ? '' : `<text class="hole" x="${VS.x + VS.w / 2}" y="80">（还没开分页：CPU 直接按物理地址访问）</text>`)
      el.maps.innerHTML = regs.filter((r) => !r.hole).map((r) => {
        const to = vaHot.get(r.id) || r.to, y1 = r.y + VS.h / 2, y2 = ANCHOR[to].y
        return `<path class="vmap${vaHot.has(r.id) ? ' hot' : ''}" d="M${VS.x} ${y1} C${VS.x - 26} ${y1} ${PH.r + 26} ${y2} ${PH.r + 1} ${y2}"/>`
      }).join('')
      /* screen */
      const L = S.vga.lines.slice(-8)
      el.screen.innerHTML = L.map((l, i) => `<text class="scr" x="1228" y="${DEV.vga.y + 44 + i * 18}">${esc(l.slice(0, 54))}</text>`).join('') +
        `<rect class="cursor" x="${1228 + Math.min(54, L.at(-1).length) * 6.6}" y="${DEV.vga.y + 33 + (L.length - 1) * 18}" width="6.6" height="14"/>`
      el.screenChg = chg.has('vga')
      el.root.querySelector('.screen').classList.toggle('chg', chg.has('vga'))
      /* transfer paths for this hop */
      el.xs = sn ? sn.xs : []
      el.xpaths.innerHTML = el.xs.map((x, i) => `<path class="xp" data-i="${i}" d="${xpath(x[0], x[1], sn.ends[i][0], sn.ends[i][1], x[3] || 'r.RIP')}"/>`).join('')
      el.xpEls = [...el.xpaths.querySelectorAll('path')]
      el.xlen = el.xpEls.map((p) => p.getTotalLength())
    }
    const cur = el.root.querySelector('.cursor'); if (cur) cur.style.opacity = Math.floor(T / 500) % 2 ? 0.15 : 1
    /* packet */
    const n = el.xs.length
    if (n && !landed && g >= 0) {
      const k = Math.min(n - 1, Math.floor(xp * n)), p = ease(clamp(xp * n - k, 0, 1))
      el.xpEls.forEach((e, i) => e.setAttribute('class', `xp ${i < k ? 'done' : i === k ? 'cur' : ''}`))
      const pt = el.xpEls[k].getPointAtLength(el.xlen[k] * p)
      el.pk.setAttribute('transform', `translate(${pt.x},${pt.y})`); el.pk.style.opacity = 1
      const lab = el.xs[k][2], w = wid(lab, 12, 6.8) + 14
      const lx = clamp(pt.x - w / 2, 4, VB.w - w - 4), ly = pt.y > 40 ? pt.y - 30 : pt.y + 12
      el.pklab.setAttribute('transform', `translate(${lx},${ly})`); el.pklab.style.opacity = 1
      el.pklab.querySelector('rect').setAttribute('width', w); el.pklab.querySelector('text').setAttribute('x', 7); el.pklab.querySelector('text').textContent = lab
    } else {
      el.xpEls?.forEach((e) => e.setAttribute('class', 'xp done'))
      el.pk.style.opacity = 0; el.pklab.style.opacity = 0
    }
    dots(el, M, g, landed, xp, T)
  }

  /* read/write marks: this hop's accesses appear as their packet leaves (read) or arrives (write) and pulse;
     earlier hops of the same step stay as a faint trail */
  function dots(el, M, g, landed, xp, T) {
    if (g < 0) { el.dots.innerHTML = ''; return }
    const sn = M.snaps[g], n = sn.xs.length, k = landed ? n + 1 : xp * n
    const trail = []
    for (let h = g - 1, c = 0; h >= 0 && M.snaps[h].step === sn.step && c < 6; h--, c++) trail.push(...M.snaps[h].acc)
    const now = sn.acc.filter((a) => (a.rw === 'r' ? k >= a.k : k >= a.k + 1 || (landed && a.k >= n)))
    const ph = (T % 1000) / 1000
    const dot = (a, cls) => {
      const x = a.cell.x + PH.cw / 2 - 0.5, y = a.cell.y + a.cell.h / 2
      return `<g class="dot ${a.rw} ${cls}" transform="translate(${x},${y})"><title>${a.rw === 'w' ? '写' : '读'} ${esc(PNAME[a.id])} ${a.exact ? '' : '≈'}${hx(a.a)}：${esc(a.label)}</title>` +
        (cls === 'now' ? `<circle class="ring" r="${4 + ph * 7}" opacity="${(1 - ph) * 0.9}"/>` : '') + '<circle class="core" r="3.4"/></g>'
    }
    el.dots.innerHTML = trail.map((a) => dot(a, 'old')).join('') + now.map((a) => dot(a, 'now')).join('')

    else if (f.type === 'enter') {

    } else {

  /* ---------- overlays ---------- */
  function overlays(f) {

  }
  function buildOverlays() {
    const st = M.st, comps = M.lanes.length
    $('#intro').innerHTML = `<div class="ov"><div class="eb">流程 ${D.stories.indexOf(st) + 1} / ${D.stories.length} · ${esc(D.meta.kernel)}</div><h1>${esc(st.title)}</h1><p>${md(st.intro)}</p>
      <div class="meta"><span>${st.steps.length} 步</span><span>${M.calls.length} 次组件跳转</span><span>${M.mm.snaps.reduce((n, s) => n + s.xs.length, 0)} 次总线传输</span><span>${comps} 个组件出场</span><span>约 ${fmt(M.dur)}（1×）</span><span>${esc(D.meta.caseLine)}</span></div>
      ${VIEW === 'mach' ? `<p class="cav">${esc(MV.caveat)}</p>` : ''}
      <div class="btns"><button type="button" data-act="start">▶ 开始播放</button><button type="button" class="alt" data-act="step1">逐步看（停在第 1 步）</button></div></div>`
    const next = D.stories[(D.stories.indexOf(st) + 1) % D.stories.length]

  }

  /* ---------- per-frame render ---------- */
  function classify(f) {
    for (const c of M.calls) {
      const cls = c.g > f.g ? 'ghost' : c.g === f.g && f.pt < 1 ? 'cur' : c.step === f.step ? 'done' : 'past'
      if (c._cls !== cls) { c.el.setAttribute('class', `call ${cls}${c.handoff ? ' handoff' : ''}`); c._cls = cls }
    }

    M.gl.forEach((e, i) => { e.classList.toggle('on', i === f.step); e.classList.toggle('done', i < f.step) })
    for (const [i, e] of M.sts) e.classList.toggle('show', i < f.step || (i === f.step && (f.type === 'hold' || f.type === 'outro')))

    if (f.type === 'intro') y = vh / 2
    else if (f.type === 'enter') {

  const hopSegOf = (g) => (g < 0 || g >= M.calls.length ? null : M.segs.find((s) => s.type === 'hop' && s.step === M.calls[g].step && s.j === M.calls[g].j))
  /* 小步递进：跳到下（上）一跳的起点播放，播完这一段自动停下；播放中途按「小步 ›」直接进入下一跳 */
  function stepCall(d) {

  $('#view').addEventListener('wheel', (e) => { if (P.playing) return; e.preventDefault(); camOff += e.deltaY; render(P.T) }, { passive: false })
  for (const id of ['intro', 'outro']) $('#' + id).addEventListener('click', (e) => {
    const a = e.target.closest('[data-act]')?.dataset.act, go = e.target.closest('[data-go]')?.dataset.go
    if (go != null) return gotoStep(+go)

  const h = /^#(\w+)(?:\/(\d+))?$/.exec(location.hash)
  const sid = Q.get('story') || (h && MODELS.has(h[1]) ? h[1] : D.stories[1]?.id || D.stories[0].id)
  setStory(MODELS.has(sid) ? sid : D.stories[0].id, { step: !RECORD && h?.[2] ? Number(h[2]) - 1 : null })

/* Deep-dive view: real source lines (with notes), virtual/physical memory maps, a page-walk

(() => {

  }

  function bootHtml() {
    return `<p class="lead">下面每一段都是 Linux 6.12.112 源码的真实行，构建时按行号从 src/ 截取，左侧是行号，带注释的行会高亮，右侧是作用说明。</p>` +
      D.boot.map((sec, i) => `<section class="sec"><h3><span class="no">${i + 1}</span>${esc(sec.title)}</h3>
        <div class="why"><b>为什么需要这一步</b>${md(sec.why)}</div>
        ${sec.ranges.map(codeBlock).join('')}</section>`).join('')
  }

  function memoryMapHtml() {
    const m = D.memory
    const regions = m.regions.map((r) => `<div class="reg" style="--c:${r.color}"><i></i><div><b>${esc(r.name)}</b><code>${esc(r.range)}</code><span>${esc(r.who)}</span></div></div>`).join('')
    const phys = m.physical.map((p) => `<div class="pr"><b>${esc(p.name)}</b><span>${esc(p.desc)}</span></div>`).join('')
    return `<p class="lead">${esc(m.note)}</p>
      <div class="mm2">
        <div class="mmcol"><h4>虚存（虚拟地址，每个进程看到的）</h4>${regions}</div>
        <div class="mmcol"><h4>实存（物理地址，RAM 上的真实位置）</h4>${phys}
          <h4>地址换算规则</h4><ul class="rules">${m.rules.map((r) => `<li>${md(r)}</li>`).join('')}</ul></div>
      </div>
      <div class="calc"><h4>地址换算演示</h4>
        <div class="row"><label>直接映射：物理地址 pa</label><input id="pa" value="0x1234000"><button id="pa-go">计算</button></div>
        <div class="out" id="pa-out"></div>
        <div class="row"><label>页表遍历：虚拟地址 va</label><input id="va" value="${esc(D.walkSamples[0].va)}"><button id="va-go">拆分</button></div>
        <div class="chips">${D.walkSamples.map((s) => `<button class="smp" data-va="${esc(s.va)}">${esc(s.label)}</button>`).join('')}</div>
        <div class="out" id="va-out"></div>
      </div>`
  }

  function regsHtml() {
    const R = D.regs
    return `<p class="lead">${md(R.intro)}</p>` + R.items.map((it, i) => `<section class="sec"><h3><span class="no">${i + 1}</span>${esc(it.name)}：${esc(it.full)}</h3>
        <div class="why"><b>作用</b>${md(it.role)}</div>
        <table class="walk"><thead><tr><th>位</th><th>名称</th><th>含义</th></tr></thead><tbody>${it.bits.map((b) => `<tr><td>${b[0]}</td><td>${esc(b[1])}</td><td>${md(b[2])}</td></tr>`).join('')}</tbody></table>
        <h4 style="margin:12px 0 4px;font-size:14px">boot 与内核初始化中的设置点</h4>
        ${it.boot.map(codeBlock).join('')}
        <div class="why"><b>在地址翻译、syscall、中断、缺页中的作用</b>${md(it.effect)}</div></section>`).join('')
  }

  function walk(vaStr) {
    const va = parseHex(vaStr)
    if (va === null || va < 0n || va >= 1n << 64n) return `<div class="err">请输入合法的 64 位十六进制地址，例如 0xffffffff81000000</div>`
    const canon = va >> 47n
    if (!(canon === 0n || canon === 0x1ffffn)) return `<div class="err">${hex(va)} 的第 63–47 位需全为 0 或全为 1 才满足规范地址要求；此值访问会产生 #GP。</div>`
    const idx = [
      ['PML4', 47, 39], ['PDPT', 38, 30], ['PD', 29, 21], ['PT', 20, 12],
    ].map(([n, hi, lo]) => ({ n, hi, lo, v: (va >> BigInt(lo)) & 0x1ffn }))
    const off = va & 0xfffn
    const rows = idx.map((x) => `<tr><td>${x.n}</td><td>第 ${x.hi}–${x.lo} 位</td><td>${x.v.toString()}</td><td>${hex(x.v * 8n, 3)}</td></tr>`).join('')
    return `<table class="walk"><thead><tr><th>级</th><th>位段</th><th>索引（十进制）</th><th>表内偏移（×8 字节 PTE）</th></tr></thead><tbody>${rows}
      <tr><td>页内偏移</td><td>第 11–0 位</td><td>${off.toString()}</td><td>${hex(off, 3)}</td></tr></tbody></table>
      <p class="tip">CR3 指向 PML4 的物理地址。CPU 依次用上面 4 个索引读取页表项，得到的物理页基址加上页内偏移 ${hex(off, 3)}，就是最终的物理地址。</p>`
  }

  function directOut(paStr) {
    const pa = parseHex(paStr)
    if (pa === null || pa < 0n) return `<div class="err">请输入合法的物理地址。</div>`
    const base = 0xffff888000000000n
    const kbase = 0xffffffff80000000n
    return `<div>直接映射 va = page_offset_base + pa = <code>${hex(base + pa)}</code>（内核用 kmalloc/alloc_pages 返回的就是这类地址）</div>
      <div>内核镜像映射 va = __START_KERNEL_map + pa = <code>${hex(kbase + pa)}</code>（仅对内核镜像所在物理区间有效）</div>`
  }

  let swIdx = { 0: 0, 1: 0 }
  function switchHtml() {
    return `<p class="lead">选择一个流程，逐步查看 CPU 在特权级、CR3、栈、GS 之间的切换。下方代码是每一步对应的真实源码行。</p>
      <div class="swtabs">${D.switching.map((s, i) => `<button data-sw="${i}" class="${i === 0 ? 'on' : ''}">${esc(s.name)}</button>`).join('')}</div>
      <div id="sw-body"></div>`
  }
  function swRender(i) {
    const sw = D.switching[i]
    const k = swIdx[i] || 0
    const st = sw.steps[k]
    const ring = st.ring === 3 ? '用户态 ring 3' : '内核态 ring 0'
    const cells = [['特权级', ring, st.ring === 3 ? '#4cc597' : '#e07a5a'], ['CR3（页表）', st.cr3, '#5aa7e0'], ['RSP（栈）', st.rsp, '#e3c26b'], ['GS 基址', st.gs, '#c59ae0']]
      .map(([a, b, c]) => `<div class="cell" style="--c:${c}"><small>${esc(a)}</small><b>${esc(b)}</b></div>`).join('')
    const dots = sw.steps.map((_, j) => `<button class="dot${j === k ? ' on' : ''}" data-swstep="${j}">${j + 1}</button>`).join('')
    const code = st.lines ? codeBlock(st.lines) : (st.src ? `<div class="src">${esc(st.src)}</div>` : '<div class="src">按硬件动作展示</div>')
    return `<div class="dots">${dots}</div>
      <div class="cells">${cells}</div>
      <div class="swwhat"><b>第 ${k + 1} / ${sw.steps.length} 步</b>${md(st.what)}</div>
      ${code}
      <div class="swnav"><button data-swprev>‹ 上一步</button><button data-swnext>下一步 ›</button></div>`
  }

  function bind(root) {
    root.addEventListener('click', (e) => {
      const t = e.target
      if (t.id === 'pa-go') $('#pa-out').innerHTML = directOut($('#pa').value)
      if (t.id === 'va-go') $('#va-out').innerHTML = walk($('#va').value)
      if (t.classList.contains('smp')) { $('#va').value = t.dataset.va; $('#va-out').innerHTML = walk(t.dataset.va) }
      if (t.dataset.sw !== undefined) {
        const i = +t.dataset.sw
        root.querySelectorAll('[data-sw]').forEach((b) => b.classList.toggle('on', b === t))
        $('#sw-body').dataset.sw = i
        $('#sw-body').innerHTML = swRender(i)
      }
      const sb = $('#sw-body'), si = +(sb.dataset.sw || 0)
      if (t.dataset.swstep !== undefined) { swIdx[si] = +t.dataset.swstep; sb.innerHTML = swRender(si) }
      if (t.hasAttribute && t.hasAttribute('data-swprev')) { swIdx[si] = Math.max(0, (swIdx[si] || 0) - 1); sb.innerHTML = swRender(si) }
      if (t.hasAttribute && t.hasAttribute('data-swnext')) { swIdx[si] = Math.min(D.switching[si].steps.length - 1, (swIdx[si] || 0) + 1); sb.innerHTML = swRender(si) }
    })
  }

  function build() {
    const root = $('#deep')
    if (!root) return
    root.innerHTML = `<div class="deep-wrap">
      <h2>代码与内存：开机源码、虚实地址、用户态与内核态</h2>
      <div class="tabs">
        <button class="tab on" data-tab="boot">开机源码</button>
        <button class="tab" data-tab="memory">虚存与实存</button>
        <button class="tab" data-tab="switch">用户态 ⇄ 内核态</button>
        <button class="tab" data-tab="regs">控制寄存器与标志位</button>
      </div>
      <div class="pane on" data-pane="boot">${bootHtml()}</div>
      <div class="pane" data-pane="memory">${memoryMapHtml()}</div>
      <div class="pane" data-pane="switch">${switchHtml()}</div>
      <div class="pane" data-pane="regs">${regsHtml()}</div>
    </div>`
    root.querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', () => {
      root.querySelectorAll('[data-tab]').forEach((x) => x.classList.toggle('on', x === b))
      root.querySelectorAll('[data-pane]').forEach((p) => p.classList.toggle('on', p.dataset.pane === b.dataset.tab))
    }))
    bind(root)
    $('#va-out').innerHTML = walk(D.walkSamples[0].va)
    $('#pa-out').innerHTML = directOut('0x1234000')
    $('#sw-body').dataset.sw = 0
    $('#sw-body').innerHTML = swRender(0)
  }

  const toggle = (on) => {
    document.body.classList.toggle('deep-on', on)
    const btn = $('#b-deep')
    if (btn) btn.textContent = on ? '返回动画' : '代码与内存'
    if (on) window.scrollTo(0, 0)
  }
  build()
  const btn = $('#b-deep')
  if (btn) btn.addEventListener('click', () => toggle(!document.body.classList.contains('deep-on')))
  if (location.hash === '#deep') toggle(true)
  window.__deep = { toggle }
})()
</script>
</body>
</html>
